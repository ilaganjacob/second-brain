[project]
name = "api"
version = "0.1.0"
description = "Second Brain API"
readme = "README.md"
authors = [
    { name = "Jacob Ilagan", email = "jacobcandoilagan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "sqlmodel>=0.0.48",
    "tzdata>=2026.5",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.fastapi]
entrypoint = "api.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
